security-test-dast-job:
  stage: security
  image: ghcr.io/zaproxy/zaproxy:stable
  script:
    - echo "Running security DAST testing"
    - zap-baseline.py -t https://juice-shop.herokuapp.com -r /zap/wrk/zap-report.html #|| true #run zap scan against juice shop and generate report, if true but don't fail the job if the scan finds issues
 
security-test-sast-job:
  stage: security
  image: horuszup/horusec-cli:latest
  script:
    - echo "Security SAST testing..."
    - horusec start -p ./ -D true

deploy-job:      # This job runs in the deploy stage.
  stage: deploy  # It only runs when *both* jobs in the test stage complete successfully.
  script:
    - echo "Deploying application..."
    - echo "Application successfully deployed."
